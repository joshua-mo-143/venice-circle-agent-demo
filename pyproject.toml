[project]
name = "venice-circle-agent-demo"
version = "0.1.0"
description = "A terminal payments agent: Venice decides what to do, a Circle wallet moves the USDC."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "circle-developer-controlled-wallets>=9.6.0",
    "httpx>=0.28.1",
    "openai>=3.41.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "urllib3>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
